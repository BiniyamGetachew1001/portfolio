<!DOCTYPE html>
<html lang="en" class="bg-[#030303]">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Graphics Portfolio | Biniyam Edits</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              black: '#030303',
              'noir-black': '#050505',
              'electric-violet': '#7F00FF',
            },
            fontFamily: {
              sans: ['Syne', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
              display: ['Oswald', 'sans-serif'],
            },
            backgroundImage: {
              'grain': "url('https://grainy-gradients.vercel.app/noise.svg')",
            },
            animation: {
              'marquee': 'marquee 25s linear infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'shimmer': 'shimmer 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% center' },
                '100%': { backgroundPosition: '200% center' },
              }
            },
          },
        },
      };
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Oswald:wght@500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
      html {
        scroll-behavior: smooth;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #030303;
      }
      ::-webkit-scrollbar-thumb {
        background: #7F00FF;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9d4edd;
      }

      /* Film Grain Overlay */
      .film-grain {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        opacity: 0.35;
        mix-blend-mode: overlay;
      }

      /* Hide default cursor to enable custom cursor experience */
      body {
        cursor: none;
      }
      a, button, input {
        cursor: none;
      }

      .text-stroke {
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2);
        color: transparent;
      }
      
      /* Advanced Card Hover Glow */
      .glow-card-gallery {
        position: relative;
        background: rgba(10, 10, 10, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 1.5rem;
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      }
      .glow-card-gallery::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border-radius: inherit;
        padding: 1.5px;
        background: radial-gradient(
          600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), 
          rgba(127, 0, 255, 0.35),
          transparent 50%
        );
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      .glow-card-gallery:hover {
        transform: translateY(-4px);
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.9), 0 0 35px -5px rgba(127, 0, 255, 0.1);
        border-color: transparent;
        background: rgba(15, 15, 15, 0.55);
      }
      .glow-card-gallery:hover::before {
        opacity: 1;
      }
    </style>
    
    <script type="importmap">
    {
      "imports": {
        "react/": "https://aistudiocdn.com/react@^19.2.1/",
        "react": "https://aistudiocdn.com/react@^19.2.1",
        "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
        "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.25",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/"
      }
    }
    </script>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="antialiased text-white overflow-x-hidden bg-black">
    <div id="root"></div>
    <div class="film-grain"></div>
    <script type="module" src="/gallery.tsx"></script>
  </body>
</html>
